name: discover-korean-search
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency:
  group: discover
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Search Naver/Daum/Google News (ko)
        run: python scripts/discover.py
      - name: Commit results
        run: bash scripts/commit_snapshots.sh
